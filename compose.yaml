services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # 本地 compose 默认走 HTTP；正式环境请改为 true 并配置 HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MONGODB_URI: mongodb://mongo:27017/xingyu_xinsheng
      # 必须通过 .env / 环境注入，生产环境不可使用示例值
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:?请先设置 AUDIT_HMAC_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CAMPUS_COUNSELING_NAME: ${CAMPUS_COUNSELING_NAME:-东南大学心理健康教育中心}
      CAMPUS_COUNSELING_PHONE: ${CAMPUS_COUNSELING_PHONE:-025-52090277}
      CAMPUS_24H_HOTLINE: ${CAMPUS_24H_HOTLINE:-15251760520}
    ports:
      - "3000:3000"

volumes:
  mongo_data:
